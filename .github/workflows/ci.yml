name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  COMPOSE_PROJECT_NAME: kubeproof-ci

defaults:
  run:
    shell: bash

jobs:
  workflow:
    name: Workflow and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --profile checks config --quiet
      - name: Lint GitHub Actions workflow and shell commands
        run: docker compose run --rm workflow-checks

  backend:
    name: Python checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build locked verification environment
        run: docker compose build checks
      - name: Lint
        run: docker compose run --rm checks ruff check src/kubeproof tests scripts
      - name: Format
        run: docker compose run --rm checks ruff format --check src/kubeproof tests scripts
      - name: Types
        run: docker compose run --rm checks mypy --cache-dir /tmp/mypy src/kubeproof scripts
      - name: Tests including real Helm and CLI integration
        run: |
          mkdir -p ci-artifacts
          docker compose run --rm --volume "$PWD/ci-artifacts:/reports" checks \
            pytest -q -p no:cacheprovider --junitxml=/reports/python.xml
      - name: Retain Python test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-report
          path: ci-artifacts/python.xml
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: React checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build frontend with TypeScript checks
        run: docker compose build frontend-checks
      - name: Tests
        run: |
          mkdir -p ci-artifacts
          docker compose run --rm --volume "$PWD/ci-artifacts:/reports" frontend-checks \
            npm test -- --reporter=default --reporter=junit --outputFile.junit=/reports/frontend.xml
      - name: Retain frontend test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-report
          path: ci-artifacts/frontend.xml
          retention-days: 7
          if-no-files-found: warn

  packaging:
    name: Production image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker compose build image-checks
      - name: Start isolated production service
        run: docker compose up -d --wait --wait-timeout 60 image-checks
      - name: Verify packaged frontend, API, CLI and container restrictions
        run: docker compose exec -T image-checks python - < scripts/ci/smoke_image.py
      - name: Collect service logs
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose logs --no-color image-checks > ci-artifacts/production-service.log 2>&1
      - name: Stop and remove test service
        if: always()
        run: docker compose rm --stop --force image-checks
      - name: Retain service logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-service-logs
          path: ci-artifacts/production-service.log
          retention-days: 7
          if-no-files-found: warn
