name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Python checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.11.21'
      - name: Install locked dependencies
        run: uv sync --frozen --extra ai --extra tracing --extra dev
      - name: Lint
        run: uv run --no-sync ruff check src/kubeproof tests
      - name: Format
        run: uv run --no-sync ruff format --check src/kubeproof tests
      - name: Types
        run: uv run --no-sync mypy src/kubeproof
      - name: Tests
        run: uv run --no-sync pytest -q

  frontend:
    name: React checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Typecheck and build
        run: npm run build

  packaging:
    name: Helm and container packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.1
      - run: helm lint deploy/charts/kubeproof
      - run: helm template kubeproof deploy/charts/kubeproof --namespace kubeproof-system > /dev/null
      - run: docker build -t kubeproof:ci .
