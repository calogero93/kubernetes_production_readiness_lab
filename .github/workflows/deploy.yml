name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: Published image digest (sha256:...)
        required: true
      namespace:
        description: Target namespace
        required: true
        default: kubeproof-system

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    concurrency: kubeproof-production
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v3.21.1
      - name: Deploy reviewed digest
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          TARGET_NAMESPACE: ${{ inputs.namespace }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$TARGET_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]
          test -n "$KUBECONFIG_B64"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          image_repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          helm upgrade --install kubeproof deploy/charts/kubeproof \
            --namespace "$TARGET_NAMESPACE" --create-namespace \
            --set image.repository="$image_repository" \
            --set image.digest="$IMAGE_DIGEST" \
            --atomic --wait --timeout 5m
