apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: kubeproof
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kubeproof
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubeproof
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubeproof
          image: {{ if .Values.image.digest }}{{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [kubeproof]
          args:
            - serve
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --data-dir
            - /data
            - --frontend-dir
            - /opt/kubeproof/frontend
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
            {{- if .Values.model.provider }}
            - name: KUBEPROOF_AI_PROVIDER
              value: {{ .Values.model.provider | quote }}
            - name: KUBEPROOF_AI_MODEL
              value: {{ required "model.name is required when model.provider is set" .Values.model.name | quote }}
            - name: KUBEPROOF_AI_BASE_URL
              value: {{ .Values.model.baseUrl | quote }}
            {{- if .Values.model.existingSecret }}
            - name: KUBEPROOF_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.existingSecret | quote }}
                  key: {{ .Values.model.apiKeyKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.langfuse.enabled }}
            - name: LANGFUSE_BASE_URL
              value: {{ required "langfuse.baseUrl is required when enabled" .Values.langfuse.baseUrl | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "langfuse.existingSecret is required when enabled" .Values.langfuse.existingSecret | quote }}
                  key: {{ .Values.langfuse.publicKeyKey | quote }}
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.langfuse.existingSecret | quote }}
                  key: {{ .Values.langfuse.secretKeyKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: temporary
          emptyDir: {}
